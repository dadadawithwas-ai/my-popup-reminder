<!DOCTYPE html>
<html lang="th" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <title>Video Alarm</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            cursor: none; /* ซ่อนเคอร์เซอร์ */
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none; /* ป้องกันการคลิกหรือกดหยุดวิดีโอ */
        }
    </style>
</head>
<body>

    <video id="alarmVideo" autoplay loop playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
    </video>

    <script>
        const video = document.getElementById('alarmVideo');

        window.addEventListener('load', () => {
            document.documentElement.requestFullscreen().catch(() => {});
            video.muted = false;
            video.volume = 1;
            video.play().catch(() => {
                // สำรอง: ถ้าเบราว์เซอร์บล็อกเสียง คลิกที่ไหนก็ได้เพื่อเริ่ม
                document.body.addEventListener('click', () => {
                    video.muted = false;
                    video.play();
                }, { once: true });
            });
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>

</body>
</html>
