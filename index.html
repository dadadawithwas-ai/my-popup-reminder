<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Popup Reminder</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 20vh; background-color: #f0f2f5; }
        .box { background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⏰ ได้เวลาแจ้งเตือนแล้ว!</h1>
        <p>นี่คือป๊อปอัปแจ้งเตือนประจำวันของคุณ</p>
    </div>
</body>
</html>
