<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Popup Reminder</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 5vh; background-color: #f0f2f5; }
        .box { background: white; padding: 20px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 800px; }
        video { width: 100%; height: auto; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⏰ ได้เวลาแจ้งเตือนแล้ว!</h1>
        <!-- เปลี่ยนชื่อไฟล์วิดีโอตรง src ให้ตรงกับชื่อไฟล์ที่คุณอัปโหลดไว้ -->
        <video autoplay controls muted loop>
            <source src="วิดีโอ.mp4" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>
    </div>
</body>
</html>
