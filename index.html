<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Video Alarm</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none; /* ป้องกันการคลิกหรือกดหยุดวิดีโอ */
        }
    </style>
</head>
<body>

    <!-- ตัดเสียง Mute ออกเพื่อให้มีเสียง และเล่นวนลูปอัตโนมัติ -->
    <video id="alarmVideo" autoplay loop playsinline>
        <source src="ลุกค่ะ มาขยับกัน ไปกับท่าที่ทำได้ในชีวิตประจำวัน_compressed_25MB.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
    </video>

    <script>
        const video = document.getElementById('alarmVideo');

        // บังคับเปิดโหมด Fullscreen และพยายามเปิดเสียงทันทีที่หน้าเว็บโหลด
        window.addEventListener('load', () => {
            document.documentElement.requestFullscreen().catch(() => {});
            video.muted = false;
            video.play().catch(() => {
                // หากเบราว์เซอร์บล็อกเสียงอัตโนมัติ ให้คลิกที่ไหนก็ได้ในจอเพื่อเปิดเสียง
                document.body.addEventListener('click', () => {
                    video.muted = false;
                    video.play();
                }, { once: true });
            });
        });

        // ป้องกันการคลิกขวาเพื่อไม่ให้กดปิดหรือกดเมนูควบคุม
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

</body>
</html>
